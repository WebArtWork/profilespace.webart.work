<section class="page">
	<div class="w-full px-4 py-4">
		@if (hasProfile()) {
			<div class="mx-auto max-w-sm">
				<div class="card flex flex-col items-center gap-5 p-4 sm:gap-6 sm:p-8">
					<p class="label" translate>Відскануйте для перегляду профілю</p>

					@if (isBrowser) {
						<div class="qr-wrap">
							<qr-code [value]="profileJson()" [size]="240" errorCorrectionLevel="M" />
						</div>
					}

					<div class="flex flex-wrap justify-center gap-3">
						<button type="button" class="btn btn--primary" (click)="saveQr()" translate>Завантажити</button>
						<button type="button" class="btn btn--secondary" (click)="shareQr()" translate>Поділитися</button>
					</div>
				</div>
			</div>
		} @else {
			<!-- Empty state -->
			<div class="card flex flex-col items-center gap-5 p-4 text-center sm:gap-6 sm:p-8">
				<div class="qr-wrap qr-wrap--empty" aria-hidden="true">
					<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 29 29" fill="none">
						<rect x="1" y="1" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.4"/>
						<rect x="3.4" y="3.4" width="2.2" height="2.2" fill="currentColor"/>
						<rect x="21" y="1" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.4"/>
						<rect x="23.4" y="3.4" width="2.2" height="2.2" fill="currentColor"/>
						<rect x="1" y="21" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.4"/>
						<rect x="3.4" y="23.4" width="2.2" height="2.2" fill="currentColor"/>
					</svg>
				</div>
				<div>
					<h1 class="text-2xl font-semibold text-[var(--c-text-strong)]" translate>Профіль ще не заповнений</h1>
					<p class="mt-2 text-[var(--c-text)]" translate>
						Заповніть профіль — з'явиться QR-код.
					</p>
				</div>
			</div>
		}
	</div>
</section>
