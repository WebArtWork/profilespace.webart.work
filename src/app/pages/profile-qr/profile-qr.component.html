<section class="page">
	<div class="w-full px-4 py-4">
		@if (hasProfile()) {
			<div class="mx-auto max-w-sm">
				<div class="card flex flex-col items-center gap-6 p-8">
					<p class="label" translate>Відскануйте для перегляду профілю</p>

					@if (isBrowser) {
						<div class="qr-wrap">
							<qr-code [value]="profileJson()" [size]="240" errorCorrectionLevel="M" />
						</div>
					}

					<div class="qr-action">
					<button type="button" class="btn btn--primary w-full" (click)="qrMenuOpen = !qrMenuOpen" translate>
						Завантажити QR
					</button>
					@if (qrMenuOpen) {
						<div class="qr-action__backdrop" (click)="qrMenuOpen = false"></div>
						<div class="qr-action__menu">
							<button type="button" class="qr-action__item" (click)="saveQr()">
								<span class="material-symbols-outlined">download</span>
								<span translate>Зберегти у Завантаження</span>
							</button>
							<button type="button" class="qr-action__item" (click)="shareQr()">
								<span class="material-symbols-outlined">share</span>
								<span translate>Поділитися</span>
							</button>
						</div>
					}
				</div>

					<div class="flex flex-wrap justify-center gap-3">
						<a routerLink="/edit" class="btn btn--download" translate>Редагувати</a>
						<a routerLink="/scan" class="btn btn--secondary" translate>Сканувати чужий QR</a>
						<button type="button" class="btn btn--ghost" (click)="clear()" translate>Очистити</button>
					</div>
				</div>
			</div>
		} @else {
			<!-- Empty state -->
			<div class="card flex flex-col items-center gap-6 p-12 text-center">
				<div class="empty-icon" aria-hidden="true">
					<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
						<rect x="3" y="3" width="7" height="7" rx="1"/>
						<rect x="14" y="3" width="7" height="7" rx="1"/>
						<rect x="3" y="14" width="7" height="7" rx="1"/>
						<path d="M14 14h1v1h-1z M18 14h1v1h-1z M14 18h1v1h-1z M18 18h1v1h-1z M16 16h1v1h-1z"/>
					</svg>
				</div>
				<div>
					<h1 class="text-2xl font-semibold text-[var(--c-text-strong)]" translate>Профіль ще не заповнений</h1>
					<p class="mt-2 text-[var(--c-text)]" translate>
						Заповніть профіль — з'явиться QR-код.
					</p>
				</div>
				<div class="flex flex-wrap justify-center gap-3">
					<a routerLink="/edit" class="btn btn--primary" translate>Створити профіль</a>
					<a routerLink="/scan" class="btn btn--secondary" translate>Сканувати чужий QR</a>
				</div>
			</div>
		}
	</div>
</section>
